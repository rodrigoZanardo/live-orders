# Local stack: `npm start` at the root. Secrets here are local demo values only; real ones come from env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: live, POSTGRES_PASSWORD: live, POSTGRES_DB: live_orders }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'live']
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 20

  # stands in for the Stock Manager stock service; point STOCK_API_URL/EMAIL/PASSWORD in .env at the real one
  stock-stub:
    image: node:22-alpine
    command: node /app/stock-stub.mjs
    working_dir: /app
    volumes: [./scripts/stock-stub.mjs:/app/stock-stub.mjs:ro]
    environment:
      STOCK_API_EMAIL: ${STOCK_API_EMAIL:-viewer@example.com}
      STOCK_API_PASSWORD: ${STOCK_API_PASSWORD:-viewer-password}

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      stock-stub: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://live:live@postgres:5432/live_orders
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      WEBHOOK_INCOMING_SECRET: ${WEBHOOK_INCOMING_SECRET:-dev-incoming}
      LATE_AFTER_MINUTES: ${LATE_AFTER_MINUTES:-10}
      WEB_ORIGIN: http://localhost:3000
      # local stack only: lets webhooks reach scripts/webhook-receiver.mjs on the host
      ALLOW_PRIVATE_WEBHOOK_TARGETS: 'true'
      # counter orders are refused until the stock answers
      STOCK_API_URL: ${STOCK_API_URL:-http://stock-stub:3040}
      STOCK_API_EMAIL: ${STOCK_API_EMAIL:-viewer@example.com}
      STOCK_API_PASSWORD: ${STOCK_API_PASSWORD:-viewer-password}
    ports: ['3001:3001']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 3s
      retries: 30

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
      stock-stub: { condition: service_started }
    environment:
      API_URL: http://api:3001
      PUBLIC_API_URL: http://localhost:3001
      COOKIE_SECURE: 'false'
      STOCK_API_URL: ${STOCK_API_URL:-http://stock-stub:3040}
      STOCK_API_EMAIL: ${STOCK_API_EMAIL:-viewer@example.com}
      STOCK_API_PASSWORD: ${STOCK_API_PASSWORD:-viewer-password}
    ports: ['3000:3000']

volumes:
  pgdata:
